# デスクトップ版(Windows/macOS/Linux)のテストと、macOS/Linuxのインストーラー作成。
#  - push / PR: 3つのOSでテスト(Windowsは既存のテストが通ることの確認)
#  - v* タグ: macOS(.dmg)とLinux(.deb / .tar.gz)を作り、そのタグのリリースにアセットを添付する(リリースが無ければ作る)
# 依存する兄弟リポジトリ(Cargo.tomlのpath依存。../../../RPoem など)は、リポジトリの隣にcloneして揃える。
# 注意: 実機のmacOS/Linuxでの動作は未確認。CIで確認できるのは、ビルド・単体テスト・パッケージ化まで。
name: desktop

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["webpage/**", "app/**", "shared-ui/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo.tomlのpath依存(../../../X)で必要な兄弟リポジトリ
  SIBLINGS: "RPoem RS-SmartTCP open-cpu open-raid-z open-web-server"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 兄弟リポジトリをcloneする
        shell: bash
        run: |
          for r in $SIBLINGS; do git clone --depth 1 "https://github.com/aon-co-jp/$r.git" "../$r"; done
      - name: Linuxのビルド用パッケージ(GTK・トレイ)と読み上げ(espeak-ng・再生)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev espeak-ng alsa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: テスト
        run: cargo test -p maid-cafe-core -p maid-cafe-desktop
      - name: ビルド(release)
        run: cargo build --release -p maid-cafe-desktop

  package-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 兄弟リポジトリをcloneする
        run: for r in $SIBLINGS; do git clone --depth 1 "https://github.com/aon-co-jp/$r.git" "../$r"; done
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev espeak-ng
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: appimagetoolを取得する(AppImage用。FUSE無しで動かすため展開実行にする)
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool-bin https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool-bin
          printf '#!/bin/sh\nexec /usr/local/bin/appimagetool-bin --appimage-extract-and-run "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: .deb と .tar.gz と AppImage を作る
        run: installer/build-linux.sh
      - name: .debの中身を確認
        run: |
          dpkg-deb -I installer/dist/*.deb
          dpkg-deb -c installer/dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            installer/dist/*.deb
            installer/dist/*.tar.gz
            installer/dist/*.AppImage
            installer/dist/SHA256SUMS-linux.txt

  package-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 兄弟リポジトリをcloneする
        run: for r in $SIBLINGS; do git clone --depth 1 "https://github.com/aon-co-jp/$r.git" "../$r"; done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: .app と .dmg を作る(universal。Secretsが全て設定されていれば署名+公証、無ければ未署名)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: installer/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            installer/dist/*.dmg
            installer/dist/SHA256SUMS-macos.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: リリースにアセットを添付する(リリースが無ければ作る)
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "macOS / Linux 版のインストーラー(未署名・実機での動作は未確認)。Windows/Android版は別途添付。"
          ls -l assets
          gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
