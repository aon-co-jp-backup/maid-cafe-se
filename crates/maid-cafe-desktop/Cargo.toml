[package]
name = "maid-cafe-desktop"
version = "0.5.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "maid-cafe-se デスクトップ版(Rust、Windows/macOS/Linux)。RPoemのローカルサーバー+Web画面、スケジューラ、音声合成(Windows=SAPI、macOS=say、Linux=espeak-ng)、タスクトレイ。"
build = "build.rs"

[lib]
name = "maid_cafe_desktop"
path = "src/lib.rs"

[[bin]]
name = "maid-cafe-se"
path = "src/main.rs"

[dependencies]
sonic-rs = "0.3"
http-body-util = "0.1"
bytes = "1.12.1"
hyper = "1"
maid-cafe-core = { path = "../maid-cafe-core" }
chrono = { workspace = true, features = ["clock"] }
open-runo-poem-compat = { version = "0.1.0", path = "../../../RPoem/crates/open-runo-poem-compat" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.36.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tray-icon = "0.24.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
ureq = "3.2.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
